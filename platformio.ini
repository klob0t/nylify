; RFID Cassette Player -- ESP32 DevKit v1 + RC522 + SSD1306 0.96" I2C
; Tap an RFID "cassette" to start Spotify playback; lift it to pause.
;
;   pio run -t upload              the real firmware
;   pio run -e tagdebug -t upload  barebones RC522 troubleshooter

[platformio]
; Without this, `pio run` would build the debug environment too.
default_envs = esp32doit-devkit-v1

[env]
platform  = espressif32
board     = esp32doit-devkit-v1
framework = arduino

; This machine also exposes two Bluetooth serial ports, which auto-detect can
; pick by mistake. Change these if the board ever enumerates elsewhere --
; `pio device list` shows the current one (look for CH9102 / CP210x / VID 1A86).
upload_port  = COM6
monitor_port = COM6

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
; The device does not echo, so without this you type commands blind.
monitor_echo    = yes

build_flags = -DCORE_DEBUG_LEVEL=1

; --------------------------------------------------------------------------
; The cassette player.
; --------------------------------------------------------------------------
[env:esp32doit-devkit-v1]
board_build.filesystem = littlefs
; TLS + WiFi makes for a big binary. The default table caps the app at 1.28MB
; and hands 1.5MB to the filesystem -- but cards.json is a couple of KB.
; min_spiffs gives the app ~1.9MB and still leaves ~190KB of storage.
board_build.partitions = min_spiffs.csv

build_src_filter = +<*> -<tagdebug.cpp>

lib_deps =
	miguelbalboa/MFRC522@^1.4.12
	adafruit/Adafruit SSD1306@^2.5.13
	adafruit/Adafruit GFX Library@^1.11.11
	bblanchon/ArduinoJson@^7.2.0

; --------------------------------------------------------------------------
; Barebones RC522 troubleshooter -- reader only, nothing else to confound it.
; --------------------------------------------------------------------------
[env:tagdebug]
build_src_filter = -<*> +<tagdebug.cpp>

lib_deps =
	miguelbalboa/MFRC522@^1.4.12
